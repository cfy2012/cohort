# Cohort 安卓端：推代码就自动出两个 APK（教师端 + 学生端）
# 不用在本地装 Android SDK —— runner 上自带 JDK 和 Android SDK。
# Gradle 版本在这里钉死成 8.11.1：runner 自带的 9.x 跟 AGP 8.7 配不上。
name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 编译两个 APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: 收集产物
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cohort-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
